name: Standard Nassau Round Robin tests
on:
  push:
    branches: [round-robin-standard-nassau]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test round-robin-standard-plan.test.cjs round-robin-standard-scores.test.cjs round-robin-standard-integration.test.cjs
